name: Deploy Vercel

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "prisma/**"
      - "scripts/db-*.mjs"
      - "scripts/prisma-cli.mjs"
      - "scripts/run-next-build.mjs"
      - "scripts/deployment-plan.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".npmrc"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Redeploy an already successful commit and run the DB guard"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-vercel-main
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      db_changed: ${{ steps.plan.outputs.db_changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        run: node scripts/deployment-plan.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_DEPLOY: ${{ inputs.force }}

  verify:
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:text
      - run: pnpm run check:openapi
      - run: pnpm run prisma:generate
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:all
      - run: pnpm run build:web

  db-sync:
    needs: [plan, verify]
    if: needs.plan.outputs.db_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prisma:generate
      - name: Ensure auth/policy unique constraints are safe to apply
        run: node scripts/db-ensure-auth-policy-constraints.mjs
      - name: Drop legacy invite token table
        env:
          ALLOW_DROP_INVITE_TOKEN: "true"
        run: node scripts/db-drop-invite-token.mjs
      - name: Prepare active job dedupe rollout
        run: node scripts/db-backfill-active-job-dedupe.mjs --mode=prepare
      - name: Push Prisma schema (non-destructive by default)
        run: pnpm exec prisma db push --schema prisma/schema.prisma
      - name: Finalize active job dedupe rollout after schema sync
        run: node scripts/db-backfill-active-job-dedupe.mjs --mode=finalize
      - name: Backfill auth/policy columns after schema sync
        run: node scripts/db-backfill-auth-policy-columns.mjs

  deploy:
    needs: [plan, verify, db-sync]
    if: ${{ !cancelled() && needs.plan.outputs.deploy == 'true' && needs.verify.result == 'success' && (needs.db-sync.result == 'success' || needs.db-sync.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prisma:generate
      - name: Validate Vercel token
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is missing. Set repository secret VERCEL_TOKEN."
            exit 1
          fi

          if ! pnpm dlx vercel@latest whoami --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "::error::VERCEL_TOKEN is invalid or expired."
            exit 1
          fi

      - name: Pull Vercel project settings
        run: pnpm dlx vercel@latest pull --yes --environment=production --token=$VERCEL_TOKEN
      - name: Build production bundle
        run: pnpm dlx vercel@latest build --prod --token=$VERCEL_TOKEN
      - name: Deploy production bundle
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token=$VERCEL_TOKEN
      - name: Finalize active job dedupe keys after deploy
        if: needs.plan.outputs.db_changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/db-backfill-active-job-dedupe.mjs --mode=finalize
