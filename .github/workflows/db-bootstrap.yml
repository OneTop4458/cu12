name: DB Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prisma:generate
      - name: Ensure auth/policy unique constraints are safe to apply
        run: node scripts/db-ensure-auth-policy-constraints.mjs
      - name: Drop legacy invite token table
        env:
          ALLOW_DROP_INVITE_TOKEN: "true"
        run: node scripts/db-drop-invite-token.mjs
      - name: Push Prisma schema
        run: pnpm exec prisma db push --schema prisma/schema.prisma
      - name: Backfill active job dedupe keys
        run: node scripts/db-backfill-active-job-dedupe.mjs
      - name: Backfill auth/policy columns after schema sync
        run: node scripts/db-backfill-auth-policy-columns.mjs
